<!-- @dsCard name="Modal" group="Components" subtitle="Destructive confirm — static rendering" width="720" height="480" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>ACME DLS — Modal</title>
<!-- @acme:styles -->
<style>
body {
  min-block-size: 100vh;
  background:
    radial-gradient(50rem 30rem at 85% -10%, color-mix(in srgb, var(--acme-blue-500) 30%, transparent), transparent 65%),
    radial-gradient(40rem 26rem at -10% 45%, color-mix(in srgb, var(--acme-red-500) 24%, transparent), transparent 65%),
    var(--acme-color-canvas);
}
</style>
</head>
<body>
  <!-- Static rendering of the destructive-confirm pattern. In product code,
       build on <dialog> + showModal(); see components/modal.md -->
  <div class="acme-modal-backdrop">
    <div class="acme-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="acme-modal__header">
        <h2 class="acme-modal__title" id="modal-title">Delete 12 products?</h2>
        <button class="acme-btn acme-btn--ghost acme-btn--sm" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="acme-modal__body">
        <p>This permanently deletes 12 products from your catalog, including
        their order history. This can't be undone.</p>
      </div>
      <div class="acme-modal__footer">
        <button class="acme-btn acme-btn--secondary">Cancel</button>
        <button class="acme-btn acme-btn--danger">Delete 12 products</button>
      </div>
    </div>
  </div>
</body>
</html>
