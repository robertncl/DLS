<!-- @dsCard name="Mobile screen" group="Components" subtitle="Compact window, touch density: app bar, list, block button, tab bar" width="390" height="760" -->
<!doctype html>
<html lang="en" class="acme-touch">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>ACME DLS — Mobile screen</title>
<!-- @acme:styles -->
<style>
body { display: flex; flex-direction: column; min-block-size: 100vh; }
main { flex: 1; display: grid; align-content: start; gap: var(--acme-space-4); padding-block-start: var(--acme-space-5); }
.pad { padding-inline: var(--acme-gutter); }
h1 { font-size: var(--acme-text-3xl); margin: 0; }
.foot { padding: var(--acme-space-3) var(--acme-gutter); }
</style>
</head>
<body>
  <header class="acme-topbar">
    <a class="acme-wordmark" href="#">
      <span class="acme-wordmark__mark" aria-hidden="true">A</span> ACME</a>
    <nav class="acme-topbar__nav" aria-label="Primary">
      <a class="acme-topbar__link" href="#">Catalog</a>
      <a class="acme-topbar__link" aria-current="page" href="#">Orders</a>
      <a class="acme-topbar__link" href="#">Depots</a>
      <a class="acme-topbar__link" href="#">Account</a>
    </nav>
    <div class="acme-topbar__actions">
      <button class="acme-btn acme-btn--ghost acme-btn--sm acme-btn--icon" aria-label="Search orders">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
    </div>
  </header>

  <main>
    <h1 class="pad">Orders</h1>
    <div class="pad">
      <div class="acme-tabs" role="tablist" aria-label="Order status">
        <button class="acme-tab" role="tab" aria-selected="true">Open<span class="acme-tab__count">12</span></button>
        <button class="acme-tab" role="tab" aria-selected="false" tabindex="-1">Shipped</button>
        <button class="acme-tab" role="tab" aria-selected="false" tabindex="-1">Returned</button>
      </div>
    </div>
    <ul class="acme-list" style="margin-block-start: calc(var(--acme-space-4) * -1);">
      <li><a class="acme-list__row" href="#">
        <span class="acme-list__body">
          <span class="acme-list__title">Order #4417</span>
          <span class="acme-list__meta">3 items · Arrives Jul 18</span>
        </span>
        <span class="acme-badge acme-badge--info">Packing</span>
        <svg class="acme-list__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a></li>
      <li><a class="acme-list__row" href="#">
        <span class="acme-list__body">
          <span class="acme-list__title">Order #4416</span>
          <span class="acme-list__meta">1 item · Arrives Jul 22</span>
        </span>
        <span class="acme-badge acme-badge--warning">Delayed</span>
        <svg class="acme-list__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a></li>
      <li><a class="acme-list__row" href="#">
        <span class="acme-list__body">
          <span class="acme-list__title">Order #4415</span>
          <span class="acme-list__meta">6 items · Arrives Jul 18</span>
        </span>
        <span class="acme-badge acme-badge--info">Packing</span>
        <svg class="acme-list__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a></li>
      <li><a class="acme-list__row" href="#">
        <span class="acme-list__body">
          <span class="acme-list__title">Order #4413</span>
          <span class="acme-list__meta">1 item · Not scheduled</span>
        </span>
        <span class="acme-badge acme-badge--danger">On hold</span>
        <svg class="acme-list__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a></li>
    </ul>
  </main>

  <div class="foot">
    <button class="acme-btn acme-btn--primary acme-btn--lg acme-btn--block">Create order</button>
  </div>

  <nav class="acme-tabbar" aria-label="Primary">
    <a class="acme-tabbar__item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Catalog</a>
    <a class="acme-tabbar__item" href="#" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 8-9-5-9 5v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
      Orders</a>
    <a class="acme-tabbar__item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
      Depots</a>
    <a class="acme-tabbar__item" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Account</a>
  </nav>
</body>
</html>
