/* ==========================================================================
   ACME Corp Design Language — acme.css  (v1.0.0)
   Single stylesheet: design tokens + base styles + core components.
   ACME Corp is a fictional company; this file is a fixture for testing
   design tooling. Canonical token data lives in tokens.json.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Tokens
   -------------------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  /* ACME Red — brand */
  --acme-red-50: #FDF3F4;
  --acme-red-100: #FAE3E6;
  --acme-red-200: #F5C2C9;
  --acme-red-300: #EC93A0;
  --acme-red-400: #E05C70;
  --acme-red-500: #D22F4C;
  --acme-red-600: #C8102E;
  --acme-red-700: #A60D26;
  --acme-red-800: #8A0F23;
  --acme-red-900: #741122;
  --acme-red-950: #43060F;

  /* Graphite — neutrals */
  --acme-gray-0: #FFFFFF;
  --acme-gray-50: #F8F9FA;
  --acme-gray-100: #F1F3F5;
  --acme-gray-200: #E4E7EB;
  --acme-gray-300: #CDD2D9;
  --acme-gray-400: #9AA1AC;
  --acme-gray-500: #6C7480;
  --acme-gray-600: #4E5560;
  --acme-gray-700: #3A404A;
  --acme-gray-800: #262B33;
  --acme-gray-900: #16191F;
  --acme-gray-950: #0C0E12;

  /* Blueprint Blue — info & focus */
  --acme-blue-50: #EFF4FE;
  --acme-blue-100: #DEE9FD;
  --acme-blue-200: #BCD2FA;
  --acme-blue-300: #8FB0F5;
  --acme-blue-400: #5F88EE;
  --acme-blue-500: #3B82F6;
  --acme-blue-600: #2563EB;
  --acme-blue-700: #1D4ED8;

  /* Go Green — success */
  --acme-green-50: #F0FBF4;
  --acme-green-300: #7FD99A;
  --acme-green-400: #4CBB74;
  --acme-green-500: #22C55E;
  --acme-green-600: #15803D;
  --acme-green-700: #116932;

  /* Caution Amber — warning */
  --acme-amber-50: #FEF8EB;
  --acme-amber-300: #FCD34D;
  --acme-amber-500: #F59E0B;
  --acme-amber-700: #B45309;
  --acme-amber-800: #92400E;

  /* Typography */
  --acme-font-sans: "Inter", "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --acme-font-display: "Archivo", "Inter", "Segoe UI", system-ui, sans-serif;
  --acme-font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --acme-text-xs: 0.75rem;
  --acme-text-sm: 0.875rem;
  --acme-text-md: 1rem;
  --acme-text-lg: 1.125rem;
  --acme-text-xl: 1.25rem;
  --acme-text-2xl: 1.5rem;
  --acme-text-3xl: 1.875rem;
  --acme-text-4xl: 2.25rem;
  --acme-text-5xl: 3rem;
  --acme-leading-tight: 1.2;
  --acme-leading-snug: 1.35;
  --acme-leading-normal: 1.5;
  --acme-leading-relaxed: 1.65;

  /* Spacing — 4px grid */
  --acme-space-1: 0.25rem;
  --acme-space-2: 0.5rem;
  --acme-space-3: 0.75rem;
  --acme-space-4: 1rem;
  --acme-space-5: 1.25rem;
  --acme-space-6: 1.5rem;
  --acme-space-8: 2rem;
  --acme-space-10: 2.5rem;
  --acme-space-12: 3rem;
  --acme-space-16: 4rem;
  --acme-space-20: 5rem;
  --acme-space-24: 6rem;

  /* Shape — generous continuous curvature; controls are capsules */
  --acme-radius-sm: 6px;
  --acme-radius-md: 12px;
  --acme-radius-lg: 20px;
  --acme-radius-xl: 28px;
  --acme-radius-full: 999px;

  /* Elevation */
  --acme-shadow-sm: 0 1px 2px rgb(12 14 18 / 0.08);
  --acme-shadow-md: 0 4px 12px -2px rgb(12 14 18 / 0.12);
  --acme-shadow-lg: 0 12px 32px -8px rgb(12 14 18 / 0.16);

  /* Materials — ACME Glass. Tint opacities are contrast floors: regular
     glass hosts controls and primary-text labels only; body and muted text
     sit on strong. See foundations/materials.md before changing. */
  --acme-glass-blur: 24px;
  --acme-glass-saturate: 160%;
  --acme-material-glass: color-mix(in srgb, var(--acme-gray-0) 62%, transparent);
  --acme-material-glass-strong: color-mix(in srgb, var(--acme-gray-0) 85%, transparent);
  --acme-glass-edge:
    inset 0 1px 0 rgb(255 255 255 / 0.65),
    inset 0 0 0 1px rgb(255 255 255 / 0.28);

  /* Motion */
  --acme-duration-fast: 100ms;
  --acme-duration-base: 150ms;
  --acme-duration-slow: 250ms;
  --acme-duration-deliberate: 400ms;
  --acme-ease-out: cubic-bezier(0.2, 0.8, 0.4, 1);
  --acme-ease-in-out: cubic-bezier(0.45, 0, 0.25, 1);
  --acme-ease-spring: cubic-bezier(0.32, 1.36, 0.5, 1);

  /* Semantic aliases — light theme (default) */
  --acme-color-canvas: var(--acme-gray-0);
  --acme-color-surface: var(--acme-gray-50);
  --acme-color-surface-raised: var(--acme-gray-0);
  --acme-color-border: var(--acme-gray-200);
  --acme-color-border-strong: var(--acme-gray-300);
  --acme-color-text: var(--acme-gray-900);
  --acme-color-text-muted: var(--acme-gray-600);
  --acme-color-text-subtle: var(--acme-gray-500);
  --acme-color-primary: var(--acme-red-600);
  --acme-color-primary-hover: var(--acme-red-700);
  --acme-color-primary-active: var(--acme-red-800);
  --acme-color-on-primary: var(--acme-gray-0);
  --acme-color-link: var(--acme-red-700);
  --acme-color-focus: var(--acme-blue-500);
  --acme-color-success: var(--acme-green-600);
  --acme-color-success-soft: var(--acme-green-50);
  --acme-color-success-soft-text: var(--acme-green-700);
  --acme-color-warning: var(--acme-amber-700);
  --acme-color-warning-soft: var(--acme-amber-50);
  --acme-color-warning-soft-text: var(--acme-amber-800);
  --acme-color-danger: var(--acme-red-700);
  --acme-color-danger-emphasis: var(--acme-red-700);
  --acme-color-danger-soft: var(--acme-red-50);
  --acme-color-danger-soft-text: var(--acme-red-700);
  --acme-color-info: var(--acme-blue-600);
  --acme-color-info-soft: var(--acme-blue-50);
  --acme-color-info-soft-text: var(--acme-blue-700);
  /* Chart marks: Blueprint carries data, red marks the single takeaway.
     Pair is CVD-validated per surface — change only in step. */
  --acme-color-data: var(--acme-blue-600);
  --acme-color-data-highlight: var(--acme-red-600);

  accent-color: var(--acme-color-primary);
}

/* Semantic aliases — dark theme. Follows the system preference unless the
   host pins a theme with data-theme="light" | "dark" on <html>. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --acme-color-canvas: var(--acme-gray-950);
    --acme-color-surface: var(--acme-gray-900);
    --acme-color-surface-raised: var(--acme-gray-800);
    --acme-color-border: var(--acme-gray-700);
    --acme-color-border-strong: var(--acme-gray-600);
    --acme-color-text: var(--acme-gray-100);
    --acme-color-text-muted: var(--acme-gray-400);
    --acme-color-text-subtle: var(--acme-gray-400);
    --acme-color-primary: var(--acme-red-500);
    --acme-color-primary-hover: var(--acme-red-400);
    --acme-color-primary-active: var(--acme-red-600);
    --acme-color-link: var(--acme-red-300);
    --acme-color-focus: var(--acme-blue-400);
    --acme-color-success: var(--acme-green-400);
    --acme-color-success-soft: color-mix(in oklab, var(--acme-green-500) 16%, var(--acme-gray-900));
    --acme-color-success-soft-text: var(--acme-green-300);
    --acme-color-warning: var(--acme-amber-500);
    --acme-color-warning-soft: color-mix(in oklab, var(--acme-amber-500) 16%, var(--acme-gray-900));
    --acme-color-warning-soft-text: var(--acme-amber-300);
    --acme-color-danger: var(--acme-red-400);
    /* danger-emphasis is a fill under white text — red-400 would fail AA */
    --acme-color-danger-emphasis: var(--acme-red-500);
    --acme-color-danger-soft: color-mix(in oklab, var(--acme-red-500) 18%, var(--acme-gray-900));
    --acme-color-danger-soft-text: var(--acme-red-300);
    --acme-color-info: var(--acme-blue-400);
    --acme-color-info-soft: color-mix(in oklab, var(--acme-blue-500) 16%, var(--acme-gray-900));
    --acme-color-info-soft-text: var(--acme-blue-300);
    --acme-color-data: var(--acme-blue-400);
    --acme-color-data-highlight: var(--acme-red-500);
    --acme-shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
    --acme-shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.5);
    --acme-shadow-lg: 0 12px 32px -8px rgb(0 0 0 / 0.6);
    --acme-material-glass: color-mix(in srgb, var(--acme-gray-900) 70%, transparent);
    --acme-material-glass-strong: color-mix(in srgb, var(--acme-gray-900) 90%, transparent);
    --acme-glass-edge:
      inset 0 1px 0 rgb(255 255 255 / 0.14),
      inset 0 0 0 1px rgb(255 255 255 / 0.07);
  }
}

:root[data-theme="dark"] {
  --acme-color-canvas: var(--acme-gray-950);
  --acme-color-surface: var(--acme-gray-900);
  --acme-color-surface-raised: var(--acme-gray-800);
  --acme-color-border: var(--acme-gray-700);
  --acme-color-border-strong: var(--acme-gray-600);
  --acme-color-text: var(--acme-gray-100);
  --acme-color-text-muted: var(--acme-gray-400);
  --acme-color-text-subtle: var(--acme-gray-400);
  --acme-color-primary: var(--acme-red-500);
  --acme-color-primary-hover: var(--acme-red-400);
  --acme-color-primary-active: var(--acme-red-600);
  --acme-color-link: var(--acme-red-300);
  --acme-color-focus: var(--acme-blue-400);
  --acme-color-success: var(--acme-green-400);
  --acme-color-success-soft: color-mix(in oklab, var(--acme-green-500) 16%, var(--acme-gray-900));
  --acme-color-success-soft-text: var(--acme-green-300);
  --acme-color-warning: var(--acme-amber-500);
  --acme-color-warning-soft: color-mix(in oklab, var(--acme-amber-500) 16%, var(--acme-gray-900));
  --acme-color-warning-soft-text: var(--acme-amber-300);
  --acme-color-danger: var(--acme-red-400);
  --acme-color-danger-emphasis: var(--acme-red-500);
  --acme-color-danger-soft: color-mix(in oklab, var(--acme-red-500) 18%, var(--acme-gray-900));
  --acme-color-danger-soft-text: var(--acme-red-300);
  --acme-color-info: var(--acme-blue-400);
  --acme-color-info-soft: color-mix(in oklab, var(--acme-blue-500) 16%, var(--acme-gray-900));
  --acme-color-info-soft-text: var(--acme-blue-300);
  --acme-color-data: var(--acme-blue-400);
  --acme-color-data-highlight: var(--acme-red-500);
  --acme-shadow-sm: 0 1px 2px rgb(0 0 0 / 0.4);
  --acme-shadow-md: 0 4px 12px -2px rgb(0 0 0 / 0.5);
  --acme-shadow-lg: 0 12px 32px -8px rgb(0 0 0 / 0.6);
  --acme-material-glass: color-mix(in srgb, var(--acme-gray-900) 70%, transparent);
  --acme-material-glass-strong: color-mix(in srgb, var(--acme-gray-900) 90%, transparent);
  --acme-glass-edge:
    inset 0 1px 0 rgb(255 255 255 / 0.14),
    inset 0 0 0 1px rgb(255 255 255 / 0.07);
  color-scheme: dark;
}

:root[data-theme="light"] {
  color-scheme: light;
}

/* --------------------------------------------------------------------------
   2. Base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--acme-font-sans);
  font-size: var(--acme-text-md);
  line-height: var(--acme-leading-normal);
  color: var(--acme-color-text);
  background: var(--acme-color-canvas);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--acme-font-display);
  line-height: var(--acme-leading-tight);
  margin: 0 0 var(--acme-space-3);
  font-weight: 700;
}
h1 { font-size: var(--acme-text-4xl); letter-spacing: -0.02em; }
h2 { font-size: var(--acme-text-3xl); letter-spacing: -0.01em; }
h3 { font-size: var(--acme-text-xl); }
h4 { font-size: var(--acme-text-lg); }

p { margin: 0 0 var(--acme-space-4); }

a {
  color: var(--acme-color-link);
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
}

code, pre {
  font-family: var(--acme-font-mono);
  font-size: 0.9em;
}

:is(a, button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--acme-color-focus);
  outline-offset: 2px;
  border-radius: var(--acme-radius-sm);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* --------------------------------------------------------------------------
   3. Wordmark
   -------------------------------------------------------------------------- */
.acme-wordmark {
  display: inline-flex;
  align-items: center;
  gap: 0.45em;
  font-family: var(--acme-font-display);
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--acme-color-text);
  text-decoration: none;
}
.acme-wordmark__mark {
  display: inline-grid;
  place-items: center;
  inline-size: 1.6em;
  block-size: 1.6em;
  border-radius: var(--acme-radius-sm);
  background: var(--acme-red-600);
  color: var(--acme-gray-0);
  font-style: italic;
  letter-spacing: 0;
}

/* --------------------------------------------------------------------------
   4. Buttons
   -------------------------------------------------------------------------- */
.acme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--acme-space-2);
  min-height: 2.5rem;
  padding: 0 var(--acme-space-4);
  border: 1px solid transparent;
  border-radius: var(--acme-radius-full);
  font: 600 var(--acme-text-sm) / 1 var(--acme-font-sans);
  color: var(--acme-color-text);
  background: transparent;
  cursor: pointer;
  transition:
    background-color var(--acme-duration-base) var(--acme-ease-out),
    border-color var(--acme-duration-base) var(--acme-ease-out),
    color var(--acme-duration-base) var(--acme-ease-out),
    scale var(--acme-duration-base) var(--acme-ease-spring);
}
.acme-btn:not(:disabled):active { scale: 0.97; }
.acme-btn--primary {
  background: var(--acme-color-primary);
  color: var(--acme-color-on-primary);
}
.acme-btn--primary:hover { background: var(--acme-color-primary-hover); }
.acme-btn--primary:active { background: var(--acme-color-primary-active); }
.acme-btn--secondary {
  background: var(--acme-material-glass);
  -webkit-backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-sm);
}
.acme-btn--secondary:hover { background: var(--acme-material-glass-strong); }
.acme-btn--ghost { color: var(--acme-color-text-muted); }
.acme-btn--ghost:hover {
  background: var(--acme-material-glass);
  color: var(--acme-color-text);
}
.acme-btn--danger {
  background: var(--acme-color-danger-emphasis);
  color: var(--acme-color-on-primary);
}
.acme-btn--danger:hover { filter: brightness(0.92); }
.acme-btn--sm { min-height: 2rem; padding: 0 var(--acme-space-3); font-size: var(--acme-text-xs); }
.acme-btn--lg { min-height: 3rem; padding: 0 var(--acme-space-5); font-size: var(--acme-text-md); }
.acme-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* --------------------------------------------------------------------------
   5. Forms
   -------------------------------------------------------------------------- */
.acme-field { display: grid; gap: var(--acme-space-1); }
.acme-label {
  font-size: var(--acme-text-sm);
  font-weight: 600;
}
.acme-label__optional {
  font-weight: 400;
  color: var(--acme-color-text-subtle);
}
.acme-input {
  min-height: 2.5rem;
  padding: 0 var(--acme-space-3);
  border: 1px solid var(--acme-color-border-strong);
  border-radius: var(--acme-radius-md);
  font: 400 var(--acme-text-sm) / var(--acme-leading-normal) var(--acme-font-sans);
  color: var(--acme-color-text);
  background: var(--acme-color-surface-raised);
  transition: border-color var(--acme-duration-base) var(--acme-ease-out);
}
textarea.acme-input { padding: var(--acme-space-2) var(--acme-space-3); min-height: 5rem; resize: vertical; }
.acme-input:hover { border-color: var(--acme-color-text-subtle); }
.acme-input::placeholder { color: var(--acme-color-text-subtle); }
.acme-input[aria-invalid="true"] { border-color: var(--acme-color-danger); }
.acme-input:disabled { background: var(--acme-color-surface); opacity: 0.6; cursor: not-allowed; }
.acme-help { font-size: var(--acme-text-xs); color: var(--acme-color-text-muted); }
.acme-error {
  font-size: var(--acme-text-xs);
  font-weight: 500;
  color: var(--acme-color-danger);
}

.acme-choice {
  display: flex;
  align-items: flex-start;
  gap: var(--acme-space-2);
  font-size: var(--acme-text-sm);
}
.acme-choice input {
  inline-size: 1.125rem;
  block-size: 1.125rem;
  margin: 0.125rem 0 0;
  flex: none;
}

.acme-switch {
  display: inline-flex;
  align-items: center;
  gap: var(--acme-space-2);
  font-size: var(--acme-text-sm);
}
.acme-switch input {
  appearance: none;
  position: relative;
  inline-size: 2.5rem;
  block-size: 1.5rem;
  flex: none;
  margin: 0;
  border: none;
  border-radius: var(--acme-radius-full);
  background: var(--acme-color-border-strong);
  cursor: pointer;
  transition: background-color var(--acme-duration-base) var(--acme-ease-out);
}
.acme-switch input::before {
  content: "";
  position: absolute;
  inset-block-start: 2px;
  inset-inline-start: 2px;
  inline-size: 1.25rem;
  block-size: 1.25rem;
  border-radius: var(--acme-radius-full);
  background: var(--acme-gray-0);
  box-shadow: var(--acme-shadow-sm);
  transition: translate var(--acme-duration-base) var(--acme-ease-out);
}
.acme-switch input:checked { background: var(--acme-color-primary); }
.acme-switch input:checked::before { translate: 1rem 0; }

/* --------------------------------------------------------------------------
   6. Card
   -------------------------------------------------------------------------- */
.acme-card {
  display: flex;
  flex-direction: column;
  border-radius: var(--acme-radius-lg);
  background: var(--acme-material-glass-strong);
  -webkit-backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-sm);
  overflow: hidden;
}
.acme-card--interactive {
  transition:
    box-shadow var(--acme-duration-base) var(--acme-ease-out),
    scale var(--acme-duration-base) var(--acme-ease-spring);
}
.acme-card--interactive:hover {
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-md);
  scale: 1.01;
}
.acme-card__media {
  aspect-ratio: 16 / 9;
  background: var(--acme-color-surface);
  display: grid;
  place-items: center;
  color: var(--acme-color-text-subtle);
}
.acme-card__body { padding: var(--acme-space-5); flex: 1; }
.acme-card__title { font-size: var(--acme-text-lg); margin-block-end: var(--acme-space-1); }
.acme-card__footer {
  display: flex;
  align-items: center;
  gap: var(--acme-space-2);
  padding: var(--acme-space-4) var(--acme-space-5);
  border-block-start: 1px solid var(--acme-color-border);
}

/* --------------------------------------------------------------------------
   7. Badge
   -------------------------------------------------------------------------- */
.acme-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--acme-space-1);
  padding: 0.125rem var(--acme-space-2);
  border-radius: var(--acme-radius-full);
  font: 600 var(--acme-text-xs) / var(--acme-leading-normal) var(--acme-font-sans);
  background: var(--acme-color-surface);
  color: var(--acme-color-text-muted);
}
.acme-badge--success { background: var(--acme-color-success-soft); color: var(--acme-color-success-soft-text); }
.acme-badge--warning { background: var(--acme-color-warning-soft); color: var(--acme-color-warning-soft-text); }
.acme-badge--danger  { background: var(--acme-color-danger-soft);  color: var(--acme-color-danger-soft-text); }
.acme-badge--info    { background: var(--acme-color-info-soft);    color: var(--acme-color-info-soft-text); }

/* --------------------------------------------------------------------------
   8. Alert
   -------------------------------------------------------------------------- */
.acme-alert {
  display: flex;
  gap: var(--acme-space-3);
  padding: var(--acme-space-4);
  border: 1px solid var(--acme-color-border);
  border-inline-start: 3px solid var(--acme-color-info);
  border-radius: var(--acme-radius-md);
  background: var(--acme-color-info-soft);
  font-size: var(--acme-text-sm);
}
.acme-alert__title { font-weight: 700; margin-block-end: var(--acme-space-1); }
.acme-alert p:last-child { margin: 0; }
.acme-alert--success { border-inline-start-color: var(--acme-color-success); background: var(--acme-color-success-soft); }
.acme-alert--warning { border-inline-start-color: var(--acme-color-warning); background: var(--acme-color-warning-soft); }
.acme-alert--danger  { border-inline-start-color: var(--acme-color-danger);  background: var(--acme-color-danger-soft); }

/* --------------------------------------------------------------------------
   9. Table
   -------------------------------------------------------------------------- */
.acme-table {
  inline-size: 100%;
  border-collapse: collapse;
  font-size: var(--acme-text-sm);
}
.acme-table th {
  text-align: start;
  font-size: var(--acme-text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--acme-color-text-muted);
  padding: var(--acme-space-2) var(--acme-space-3);
  border-block-end: 1px solid var(--acme-color-border-strong);
}
.acme-table td {
  padding: var(--acme-space-3);
  border-block-end: 1px solid var(--acme-color-border);
}
.acme-table tbody tr:hover { background: var(--acme-color-surface); }
.acme-table .acme-table__num { text-align: end; font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------------------
   10. Tabs
   -------------------------------------------------------------------------- */
/* Floating segmented control: a glass capsule; the selected segment is a
   raised opaque chip so its label never depends on the backdrop. */
.acme-tabs {
  display: inline-flex;
  gap: var(--acme-space-1);
  padding: var(--acme-space-1);
  border-radius: var(--acme-radius-full);
  background: var(--acme-material-glass);
  -webkit-backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-sm);
}
.acme-tab {
  padding: var(--acme-space-2) var(--acme-space-4);
  border: none;
  border-radius: var(--acme-radius-full);
  background: none;
  font: 500 var(--acme-text-sm) / var(--acme-leading-normal) var(--acme-font-sans);
  color: var(--acme-color-text-muted);
  cursor: pointer;
  transition:
    background-color var(--acme-duration-base) var(--acme-ease-out),
    color var(--acme-duration-base) var(--acme-ease-out);
}
.acme-tab:hover { color: var(--acme-color-text); }
.acme-tab[aria-selected="true"] {
  background: var(--acme-color-surface-raised);
  color: var(--acme-color-text);
  font-weight: 600;
  box-shadow: var(--acme-shadow-sm);
}

/* --------------------------------------------------------------------------
   11. Top bar & breadcrumbs
   -------------------------------------------------------------------------- */
/* Floating glass bar: strong material (labels are muted text), capsule
   shape, hovers over content instead of capping it. */
.acme-topbar {
  display: flex;
  align-items: center;
  gap: var(--acme-space-6);
  padding: var(--acme-space-2) var(--acme-space-4);
  border-radius: var(--acme-radius-full);
  background: var(--acme-material-glass-strong);
  -webkit-backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-md);
  color: var(--acme-color-text);
}
.acme-topbar__nav { display: flex; gap: var(--acme-space-1); margin-inline-start: auto; }
.acme-topbar__link {
  padding: var(--acme-space-1) var(--acme-space-3);
  border-radius: var(--acme-radius-full);
  color: var(--acme-color-text-muted);
  font-size: var(--acme-text-sm);
  font-weight: 500;
  text-decoration: none;
}
.acme-topbar__link:hover { color: var(--acme-color-text); }
.acme-topbar__link[aria-current="page"] {
  background: var(--acme-color-surface-raised);
  color: var(--acme-color-text);
  box-shadow: var(--acme-shadow-sm);
}

.acme-breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--acme-space-2);
  font-size: var(--acme-text-sm);
  color: var(--acme-color-text-subtle);
}
.acme-breadcrumbs a { color: var(--acme-color-text-muted); text-decoration: none; }
.acme-breadcrumbs a:hover { text-decoration: underline; }
.acme-breadcrumbs [aria-current="page"] { color: var(--acme-color-text); font-weight: 500; }

/* --------------------------------------------------------------------------
   12. Modal
   -------------------------------------------------------------------------- */
.acme-modal-backdrop {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--acme-space-5);
  background: rgb(12 14 18 / 0.3);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.acme-modal {
  inline-size: min(28rem, 100%);
  border-radius: var(--acme-radius-xl);
  background: var(--acme-material-glass-strong);
  -webkit-backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-lg);
}
.acme-modal__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--acme-space-5) var(--acme-space-6) 0;
}
.acme-modal__title { font-size: var(--acme-text-xl); margin: 0; }
.acme-modal__body { padding: var(--acme-space-3) var(--acme-space-6); color: var(--acme-color-text-muted); font-size: var(--acme-text-sm); }
.acme-modal__footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--acme-space-2);
  padding: var(--acme-space-4) var(--acme-space-6) var(--acme-space-6);
}

/* --------------------------------------------------------------------------
   13. Presentation slides
   Slide type is sized in cqi so a slide renders correctly at any width
   (thumbnail, editor, projector). cqi on the container itself would resolve
   against an ancestor, so the padding lives on a required inner __frame.
   -------------------------------------------------------------------------- */
.acme-slide {
  container-type: inline-size;
  aspect-ratio: 16 / 9;
  display: flex;
  overflow: hidden;
  background: var(--acme-color-canvas);
  color: var(--acme-color-text);
}
.acme-slide__frame {
  flex: 1;
  min-inline-size: 0;
  display: flex;
  flex-direction: column;
  padding: 5cqi 6cqi;
}
.acme-slide .acme-wordmark { font-size: 2cqi; }
.acme-slide__kicker {
  font: 700 1.8cqi/1.2 var(--acme-font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--acme-color-primary);
  margin: 0 0 1.5cqi;
}
.acme-slide__title {
  font: 700 4cqi/1.15 var(--acme-font-display);
  letter-spacing: -0.02em;
  margin: 0 0 2cqi;
}
.acme-slide--hero .acme-slide__title { font-size: 6cqi; margin-block-end: 1cqi; }
.acme-slide__meta {
  font-size: 1.8cqi;
  color: var(--acme-color-text-muted);
  margin: 0;
}
.acme-slide__body {
  font-size: 2.2cqi;
  line-height: var(--acme-leading-normal);
  color: var(--acme-color-text-muted);
  max-inline-size: 66cqi;
  margin: 0;
}
.acme-slide__bullets {
  margin: 0;
  padding-inline-start: 2.5cqi;
  display: grid;
  gap: 1.5cqi;
  font-size: 2.2cqi;
  line-height: var(--acme-leading-snug);
  max-inline-size: 66cqi;
}
.acme-slide__bullets li::marker { color: var(--acme-color-primary); }
.acme-slide__footer {
  margin-block-start: auto;
  padding-block-start: 2cqi;
  display: flex;
  align-items: center;
  gap: 2cqi;
  font-size: 1.4cqi;
  color: var(--acme-color-text-subtle);
}
.acme-slide__footer .acme-wordmark { font-size: 1.4cqi; }
.acme-slide__footer-num { margin-inline-start: auto; font-variant-numeric: tabular-nums; }

/* Dark bookends (title & closing) keep Graphite regardless of theme */
.acme-slide--dark {
  background: var(--acme-gray-950);
  color: var(--acme-gray-100);
}
.acme-slide--dark :is(.acme-slide__meta, .acme-slide__body) { color: var(--acme-gray-400); }
.acme-slide--dark .acme-slide__footer { color: var(--acme-gray-500); }
.acme-slide--dark .acme-wordmark { color: var(--acme-gray-0); }

/* Section divider — the one sanctioned full-bleed red moment */
.acme-slide--section {
  background: var(--acme-red-600);
  color: var(--acme-gray-0);
}
.acme-slide--section .acme-slide__kicker { color: var(--acme-red-200); }
.acme-slide--section .acme-slide__num {
  font: 800 12cqi/1 var(--acme-font-display);
  font-style: italic;
  color: var(--acme-red-300);
  margin: 0 0 1cqi;
}
.acme-slide--section .acme-slide__title { margin: 0; }

/* Data slide chart — Blueprint carries data, red marks the single takeaway */
.acme-slide__chart {
  flex: 1;
  min-block-size: 0;
  display: flex;
  align-items: stretch;
  gap: 1.5cqi;
  border-block-end: 1px solid var(--acme-color-border-strong);
}
.acme-slide__col {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 0.8cqi;
}
.acme-slide__bar {
  inline-size: 68%;
  background: var(--acme-color-data);
  border-radius: min(4px, 0.4cqi) min(4px, 0.4cqi) 0 0;
}
.acme-slide__bar--highlight { background: var(--acme-color-data-highlight); }
.acme-slide__bar-label {
  font: 600 1.6cqi/1 var(--acme-font-sans);
  font-variant-numeric: tabular-nums;
}
.acme-slide__ticks {
  display: flex;
  gap: 1.5cqi;
  padding-block-start: 0.8cqi;
  font-size: 1.4cqi;
  color: var(--acme-color-text-subtle);
}
.acme-slide__ticks span { flex: 1; text-align: center; }

/* --------------------------------------------------------------------------
   14. Report document
   Long-form editorial styles. Red appears in exactly three places: the cover
   rule, heading numerals, and the key-finding callout accent.
   -------------------------------------------------------------------------- */
.acme-doc {
  max-inline-size: 65ch;
  font-size: var(--acme-text-md);
  line-height: var(--acme-leading-relaxed);
  counter-reset: doc-h2 doc-fig;
}
.acme-doc h2 {
  counter-increment: doc-h2;
  counter-reset: doc-h3;
  margin-block: var(--acme-space-8) var(--acme-space-3);
}
.acme-doc h3 {
  counter-increment: doc-h3;
  margin-block: var(--acme-space-6) var(--acme-space-2);
}
.acme-doc h2::before { content: counter(doc-h2) ".\2002"; color: var(--acme-color-primary); }
.acme-doc h3::before { content: counter(doc-h2) "." counter(doc-h3) "\2002"; color: var(--acme-color-primary); }

.acme-doc-kicker {
  font: 700 var(--acme-text-xs)/1.2 var(--acme-font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--acme-color-primary);
  margin: 0 0 var(--acme-space-2);
}
.acme-doc-rule {
  inline-size: var(--acme-space-16);
  block-size: 4px;
  border: none;
  border-radius: 2px;
  background: var(--acme-red-600);
  margin: var(--acme-space-4) 0;
}
.acme-doc-meta {
  font-size: var(--acme-text-sm);
  color: var(--acme-color-text-muted);
  margin: 0;
}

.acme-callout {
  border-inline-start: 3px solid var(--acme-color-primary);
  border-radius: var(--acme-radius-md);
  background: var(--acme-color-surface);
  padding: var(--acme-space-4) var(--acme-space-5);
  margin: var(--acme-space-6) 0;
}
.acme-callout__label {
  font: 700 var(--acme-text-xs)/1.2 var(--acme-font-sans);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--acme-color-primary);
  margin: 0 0 var(--acme-space-1);
}
.acme-callout p:last-child { margin: 0; }

.acme-figure { margin: var(--acme-space-6) 0; }
.acme-figure figcaption {
  font-size: var(--acme-text-xs);
  color: var(--acme-color-text-muted);
  margin-block-start: var(--acme-space-2);
}
.acme-figure figcaption::before {
  counter-increment: doc-fig;
  content: "Figure " counter(doc-fig) " — ";
  font-weight: 600;
}

.acme-doc-footer {
  display: flex;
  justify-content: space-between;
  gap: var(--acme-space-4);
  border-block-start: 1px solid var(--acme-color-border);
  padding-block-start: var(--acme-space-2);
  font-size: var(--acme-text-xs);
  color: var(--acme-color-text-subtle);
}

@media print {
  * {
    box-shadow: none !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
  /* Paper is not a backdrop — glass prints opaque */
  :root:not([data-theme=""]) {
    --acme-material-glass: var(--acme-gray-0);
    --acme-material-glass-strong: var(--acme-gray-0);
  }
  .acme-figure, .acme-callout, .acme-card, table { break-inside: avoid; }
  .acme-doc { max-inline-size: none; }
}

/* --------------------------------------------------------------------------
   15. Materials — ACME Glass utilities & opaque fallbacks
   Components bake the materials in; .acme-glass is for bespoke surfaces.
   -------------------------------------------------------------------------- */
.acme-glass,
.acme-glass--strong {
  background: var(--acme-material-glass);
  -webkit-backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  backdrop-filter: blur(var(--acme-glass-blur)) saturate(var(--acme-glass-saturate));
  box-shadow: var(--acme-glass-edge), var(--acme-shadow-md);
}
.acme-glass--strong { background: var(--acme-material-glass-strong); }

/* Every glass surface degrades to the theme's raised surface: browsers
   without backdrop-filter, and users who ask for less transparency.
   (:root:not([data-theme=""]) matches every root at 0-1-1 specificity so
   these overrides beat the dark-theme token blocks above.) */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root:not([data-theme=""]) {
    --acme-material-glass: var(--acme-color-surface-raised);
    --acme-material-glass-strong: var(--acme-color-surface-raised);
    --acme-glass-blur: 0px;
  }
}
@media (prefers-reduced-transparency: reduce) {
  :root:not([data-theme=""]) {
    --acme-material-glass: var(--acme-color-surface-raised);
    --acme-material-glass-strong: var(--acme-color-surface-raised);
    --acme-glass-blur: 0px;
  }
}
</style>
