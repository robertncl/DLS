<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}</style></head><body><div style="display:flex;gap:48px;align-items:flex-start"><div style="border:1px solid var(--acme-color-border);border-radius:12px;background:var(--acme-color-surface-raised);padding:20px;width:230px;box-shadow:var(--acme-shadow-sm)"><div style="font:600 15px var(--acme-font-sans);letter-spacing:var(--acme-tracking-snug);margin-bottom:4px">Card padding 20</div><div style="font-size:13px;color:var(--acme-color-text-muted)">Internal gaps 4–16</div></div><div style="border:1px solid var(--acme-color-border);border-radius:12px;background:var(--acme-color-surface-raised);padding:20px;width:230px;box-shadow:var(--acme-shadow-sm)"><div style="font:600 15px var(--acme-font-sans);letter-spacing:var(--acme-tracking-snug);margin-bottom:4px">Section gap 48</div><div style="font-size:13px;color:var(--acme-color-text-muted)">Unrelated sections sit 48px apart</div></div></div></body></html>
