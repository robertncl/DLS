<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div class="row"><div class="sw"><b style="background:var(--acme-blue-50)"></b><span>50</span></div><div class="sw"><b style="background:var(--acme-blue-100)"></b><span>100</span></div><div class="sw"><b style="background:var(--acme-blue-200)"></b><span>200</span></div><div class="sw"><b style="background:var(--acme-blue-300)"></b><span>300</span></div><div class="sw"><b style="background:var(--acme-blue-500)"></b><span>500</span></div><div class="sw"><b style="background:var(--acme-blue-600)"></b><span>600 ★</span></div><div class="sw"><b style="background:var(--acme-blue-700)"></b><span>700</span></div><div class="sw"><b style="background:var(--acme-blue-800)"></b><span>800</span></div></div><div class="note">600 for focus rings, checked controls and the chart takeaway (6.4:1); 700 for links and info ink (8.4:1); 50 tints selected rows. Never decoration.</div></body></html>
