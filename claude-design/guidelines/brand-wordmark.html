<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div style="display:flex;gap:40px;align-items:center"><a class="acme-wordmark" style="font-size:28px"><span class="acme-wordmark__mark">A</span>ACME</a><div style="background:var(--acme-gray-950);padding:20px 28px;border-radius:var(--acme-radius-lg)"><a class="acme-wordmark acme-wordmark--on-dark" style="font-size:20px"><span class="acme-wordmark__mark">A</span>ACME</a></div><span class="acme-wordmark" style="font-size:28px" role="img" aria-label="ACME"><span class="acme-wordmark__mark" aria-hidden="true">A</span></span></div><div class="note" style="margin-top:14px">Clearspace ≥ mark height · mark ≥ 20px · mark alone OK at 24px+ (favicon, avatar) · the “A” is upright, never italic</div></body></html>
