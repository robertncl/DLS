<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div class="row"><div class="sw"><b style="background:var(--acme-gray-0)"></b><span>0</span></div><div class="sw"><b style="background:var(--acme-gray-50)"></b><span>50</span></div><div class="sw"><b style="background:var(--acme-gray-100)"></b><span>100</span></div><div class="sw"><b style="background:var(--acme-gray-200)"></b><span>200</span></div><div class="sw"><b style="background:var(--acme-gray-300)"></b><span>300</span></div><div class="sw"><b style="background:var(--acme-gray-400)"></b><span>400</span></div><div class="sw"><b style="background:var(--acme-gray-500)"></b><span>500</span></div><div class="sw"><b style="background:var(--acme-gray-600)"></b><span>600</span></div><div class="sw"><b style="background:var(--acme-gray-700)"></b><span>700</span></div><div class="sw"><b style="background:var(--acme-gray-800)"></b><span>800</span></div><div class="sw"><b style="background:var(--acme-gray-900)"></b><span>900 ★</span></div><div class="sw"><b style="background:var(--acme-gray-950)"></b><span>950</span></div></div><div class="note">If a colour isn’t acting, interacting, reporting or signing the brand, it’s Graphite. 900 is ink: body text and the one primary fill (17.8:1 on white).</div></body></html>
