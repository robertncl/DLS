<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div class="row"><div style="flex:1;background:var(--acme-color-success-soft);color:var(--acme-color-success-soft-text);border:1px solid var(--acme-color-success-border);border-radius:var(--acme-radius-lg);padding:14px 16px;font:600 13px var(--acme-font-sans)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acme-color-success)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M20 6 9 17l-5-5"/></svg>Success<br><span style="font:400 12px var(--acme-font-mono)">In stock</span></div><div style="flex:1;background:var(--acme-color-warning-soft);color:var(--acme-color-warning-soft-text);border:1px solid var(--acme-color-warning-border);border-radius:var(--acme-radius-lg);padding:14px 16px;font:600 13px var(--acme-font-sans)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acme-color-warning)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg>Warning<br><span style="font:400 12px var(--acme-font-mono)">Low stock</span></div><div style="flex:1;background:var(--acme-color-danger-soft);color:var(--acme-color-danger-soft-text);border:1px solid var(--acme-color-danger-border);border-radius:var(--acme-radius-lg);padding:14px 16px;font:600 13px var(--acme-font-sans)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acme-color-danger)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg>Danger<br><span style="font:400 12px var(--acme-font-mono)">Payment failed</span></div><div style="flex:1;background:var(--acme-color-info-soft);color:var(--acme-color-info-soft-text);border:1px solid var(--acme-color-info-border);border-radius:var(--acme-radius-lg);padding:14px 16px;font:600 13px var(--acme-font-sans)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--acme-color-info)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>Info<br><span style="font:400 12px var(--acme-font-mono)">Beta</span></div></div><div class="note">Each status has its own hue, so status scans at a glance — but hue is never the only cue (WCAG 1.4.1): badges name the status and alerts carry an icon and a title.</div></body></html>
