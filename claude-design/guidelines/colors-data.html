<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div style="display:flex;align-items:flex-end;gap:10px;height:90px"><div style="width:36px;height:40%;background:var(--acme-color-data);border-radius:3px 3px 0 0"></div><div style="width:36px;height:65%;background:var(--acme-color-data);border-radius:3px 3px 0 0"></div><div style="width:36px;height:50%;background:var(--acme-color-data);border-radius:3px 3px 0 0"></div><div style="width:36px;height:80%;background:var(--acme-color-data-highlight);border-radius:3px 3px 0 0"></div><div style="width:36px;height:55%;background:var(--acme-color-data);border-radius:3px 3px 0 0"></div></div><div style="display:flex;gap:16px;margin-top:10px;font:600 12px var(--acme-font-mono);color:var(--acme-color-text-muted)"><span>--acme-color-data</span><span style="color:var(--acme-color-link);font-weight:700">--acme-color-data-highlight (one mark only)</span></div><div class="note" style="margin-top:8px">Blue against grey stays distinct under protanopia and deuteranopia; the takeaway is also the darker mark (6.4:1 vs 3.5:1).</div></body></html>
