<!-- @dsCard group="Colors" viewport="700x150" name="Amber" subtitle="Warning status only" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div class="row"><div class="sw"><b style="background:var(--acme-amber-50)"></b><span>50</span></div><div class="sw"><b style="background:var(--acme-amber-200)"></b><span>200</span></div><div class="sw"><b style="background:var(--acme-amber-600)"></b><span>600</span></div><div class="sw"><b style="background:var(--acme-amber-700)"></b><span>700 ★</span></div><div class="sw"><b style="background:var(--acme-amber-800)"></b><span>800</span></div></div><div class="note">50 / 800 / 200 are the warning soft, soft-text and border set; 700 is warning ink and the alert icon (7.3:1).</div></body></html>
