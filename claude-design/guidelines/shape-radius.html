<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div class="row" style="display:flex;align-items:flex-end;gap:8px"><div style="flex:1;text-align:center"><div style="height:64px;border:1px solid var(--acme-color-border-strong);border-radius:var(--acme-radius-sm);background:var(--acme-color-surface)"></div><div style="font:600 12px var(--acme-font-mono);margin-top:6px;color:var(--acme-color-text-muted)">sm · 4px<br><i style="font-family:var(--acme-font-sans);font-weight:400">badges, checkboxes</i></div></div><div style="flex:1;text-align:center"><div style="height:64px;border:1px solid var(--acme-color-border-strong);border-radius:var(--acme-radius-md);background:var(--acme-color-surface)"></div><div style="font:600 12px var(--acme-font-mono);margin-top:6px;color:var(--acme-color-text-muted)">md · 6px<br><i style="font-family:var(--acme-font-sans);font-weight:400">buttons, inputs, nav links</i></div></div><div style="flex:1;text-align:center"><div style="height:64px;border:1px solid var(--acme-color-border-strong);border-radius:var(--acme-radius-lg);background:var(--acme-color-surface)"></div><div style="font:600 12px var(--acme-font-mono);margin-top:6px;color:var(--acme-color-text-muted)">lg · 10px<br><i style="font-family:var(--acme-font-sans);font-weight:400">cards, alerts</i></div></div><div style="flex:1;text-align:center"><div style="height:64px;border:1px solid var(--acme-color-border-strong);border-radius:var(--acme-radius-xl);background:var(--acme-color-surface)"></div><div style="font:600 12px var(--acme-font-mono);margin-top:6px;color:var(--acme-color-text-muted)">xl · 12px<br><i style="font-family:var(--acme-font-sans);font-weight:400">modals</i></div></div><div style="flex:1;text-align:center"><div style="height:64px;border:1px solid var(--acme-color-border-strong);border-radius:var(--acme-radius-full);background:var(--acme-color-surface)"></div><div style="font:600 12px var(--acme-font-mono);margin-top:6px;color:var(--acme-color-text-muted)">full · pill<br><i style="font-family:var(--acme-font-sans);font-weight:400">switch track, tab count</i></div></div></div></body></html>
