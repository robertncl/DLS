<!-- @dsCard group="Colors" viewport="700x150" name="Signal Red" subtitle="The brand signature — and, on a control, only ever destructive" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}.note{font-size:12px;color:var(--acme-color-text-subtle);margin-top:12px}</style></head><body><div class="row"><div class="sw"><b style="background:var(--acme-red-50)"></b><span>50</span></div><div class="sw"><b style="background:var(--acme-red-100)"></b><span>100</span></div><div class="sw"><b style="background:var(--acme-red-200)"></b><span>200</span></div><div class="sw"><b style="background:var(--acme-red-300)"></b><span>300</span></div><div class="sw"><b style="background:var(--acme-red-400)"></b><span>400</span></div><div class="sw"><b style="background:var(--acme-red-500)"></b><span>500</span></div><div class="sw"><b style="background:var(--acme-red-600)"></b><span>600 ★</span></div><div class="sw"><b style="background:var(--acme-red-700)"></b><span>700</span></div><div class="sw"><b style="background:var(--acme-red-800)"></b><span>800</span></div><div class="sw"><b style="background:var(--acme-red-900)"></b><span>900</span></div></div><div class="note">600 is the wordmark mark and the danger button fill; 700 is danger text and the editorial accent in decks and reports. Never on a control unless the action destroys something.</div></body></html>
