<!DOCTYPE html><html><head><link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components/bundle.css"><style>body{margin:0;padding:16px 20px;background:var(--acme-color-canvas);font-family:var(--acme-font-sans);color:var(--acme-color-text)}.row{display:flex;gap:8px}.sw{flex:1;border-radius:6px;border:1px solid var(--acme-color-border)}.sw b{display:block;height:56px;border-radius:5px 5px 0 0}.sw span{display:block;overflow-wrap:anywhere;font:600 12px/1.3 var(--acme-font-mono);padding:4px 6px;color:var(--acme-color-text-muted)}</style></head><body><div style="display:grid;gap:7px"><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-1 · 4px</span><span style="height:14px;width:16px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">icon gaps</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-2 · 8px</span><span style="height:14px;width:32px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">inside controls</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-3 · 12px</span><span style="height:14px;width:48px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">input padding, cells</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-4 · 16px</span><span style="height:14px;width:64px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">related elements</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-5 · 20px</span><span style="height:14px;width:80px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">card padding</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-6 · 24px</span><span style="height:14px;width:96px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">section padding, gutters</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-8 · 32px</span><span style="height:14px;width:128px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">between groups</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-12 · 48px</span><span style="height:14px;width:192px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(--acme-color-text-subtle)">between page sections</span></div><div style="display:flex;align-items:center;gap:12px"><span style="font:600 12px var(--acme-font-mono);width:110px;flex:none;color:var(--acme-color-text-muted)">space-16 · 64px</span><span style="height:14px;width:256px;background:var(--acme-color-data);border-radius:2px;flex:none"></span><span style="font-size:12px;color:var(-
